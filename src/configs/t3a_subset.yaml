# 
# t3a_subset.yaml
# -------------------------
# Configuration for trial 3a: Subset of composers for focused study.
# 

experiment:
  trial: "trial3a"
  description: "Five composers with >100 works"

dataset:
  composers:
    - Frédéric Chopin
    - Franz Schubert
    - Ludwig van Beethoven
    - Johann Sebastian Bach
    - Franz Liszt
  min_works_per_composer: 100

training:
  epochs: 100  # Increased from 50 for more learning time on 5-class task
  batch_size: 16  # Increased from 12 for better gradient estimates
  learning_rate: 0.00005  # Lower learning rate for stable convergence
  early_stopping:
    patience: 10  # Allow more epochs without improvement
    min_delta: 0.0005
