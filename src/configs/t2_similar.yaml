# 
# t2_similar.yaml
# -------------------------
# Configuration for trial 2: Similar composers from the same period.
# 

experiment:
  trial: "trial2"
  description: "Romantic-period composers with similar style"

dataset:
  composers: ["Frédéric Chopin", "Franz Schubert"]
  min_works_per_composer: 50

model:
  audio_cnn:
    embedding_dim: 256
    dropout: 0.3  # Match original successful config
  feature_mlp:
    embedding_dim: 128
    hidden_layers: [256, 128]
    dropout: 0.3  # Match original successful config
  fusion:
    hidden_dim: 256
    dropout: 0.4  # Match original successful config

training:
  epochs: 50  # Increased from original 35
  batch_size: 16  # Doubled from original 8 for more stable gradients
  learning_rate: 0.0001  # Match original successful config (NOT the reduced base.yaml value)
  early_stopping:
    enabled: false  # Disable - original didn't use it and worked better