# 
# base.yaml
# -------------------------
# Shared base configuration for composer classification trials.
# 

experiment:
  name: "composer_classification"

dataset:
  sample_rate: 22050
  clip_duration_sec: 30
  hop_length: 512
  n_mels: 128

features:
  audio:
    mel_spectrogram: true
    mfcc:
      enabled: true
      n_mfcc: 13
      stats: ["mean", "std"]
    chroma: true
    spectral:
      centroid: true
      bandwidth: true
      rolloff: true

  midi:
    enabled: true
    note_density: true
    pitch_range: true
    mean_velocity: true
    chord_histogram: true

model:
  multimodal: true

  audio_cnn:
    embedding_dim: 256  # Reduced from 512 for stability
    dropout: 0.3

  feature_mlp:
    embedding_dim: 128  # Reduced from 256 for stability
    hidden_layers: [256, 128]  # Reduced from [512, 256]
    dropout: 0.3

  fusion:
    hidden_dim: 256  # Reduced from 512 for stability
    dropout: 0.3
    type: "concat"  # Revert to simple concatenation (gated was causing instability) # Changed from "concat" to "gated" for better modality integration

training:
  batch_size: 8
  epochs: 40
  learning_rate: 0.00005  # Lowered from 0.0001 for more stable learning
  optimizer: "adam"
  class_weighting: true
  weight_method: "balanced"  # Options: "balanced" or "inverse_frequency"
  
  # Loss function configuration for handling class imbalance
  loss:
    type: "weighted_crossentropy"  # Options: "sparse_categorical_crossentropy", "weighted_crossentropy", "focal_loss"
    use_class_weights: true  # Whether to apply class weights to the loss
    focal_gamma: 2.0  # (only for focal_loss) Focusing parameter for hard examples
    focal_alpha: 0.25  # (only for focal_loss) Weighting factor for positive/negative examples
  
  k_folds: 5  # Use k-fold cross validation by default. Set to null or add 'use_simple_split: true' to disable
  lr_schedule:
    enabled: false  # Disable for stability - was causing aggressive LR drops
  early_stopping:
    enabled: false # Disable becasue it was causing premature stopping in some trials 

evaluation:
  metrics: ["accuracy", "confusion_matrix", "f1_macro"]

output:
  model_dir: "outputs/models"
  log_dir: "outputs/logs"
  results_dir: "outputs/results"
