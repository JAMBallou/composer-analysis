# Configuration for trial 3a: Subset of composers for focused study.
# 

experiment:
  trial: "trial3a"
  description: "Five composers with >100 works"

dataset:
  composers:
    - Johann Sebastian Bach
    - Wolfgang Amadeus Mozart
    - Ludwig van Beethoven
    - Frédéric Chopin
    - Franz Liszt
  min_works_per_composer: 100

training:
  epochs: 50
  batch_size: 12
