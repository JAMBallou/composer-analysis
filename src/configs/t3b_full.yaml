experiment:
  trial: "trial3b"
  description: "Full 14-composer subset with class imbalance"

dataset:
  composers:
    - Bach
    - Mozart
    - Beethoven
    - Haydn
    - Chopin
    - Liszt
    - Schubert
    - Brahms
    - Debussy
    - Rachmaninoff
    - Scriabin
    - Mendelssohn
    - Scarlatti
    - Schumann
  min_works_per_composer: 20

training:
  epochs: 60
  class_weighting: true
