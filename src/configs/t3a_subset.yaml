# 
# t3a_subset.yaml
# -------------------------
# Configuration for trial 3a: Subset of composers for focused study.
# 

experiment:
  trial: "trial3a"
  description: "Five composers with >100 works"

dataset:
  composers:
    - Frédéric Chopin
    - Franz Schubert
    - Ludwig van Beethoven
    - Johann Sebastian Bach
    - Franz Liszt
  min_works_per_composer: 100

training:
  epochs: 100
  batch_size: 24  # Increased from 16 for more stable gradients
  learning_rate: 0.00005
  early_stopping:
    patience: 20  # Increased from 10 to allow learning through noisy periods
    min_delta: 0.0003  # Lowered from 0.0005 for more sensitive detection
