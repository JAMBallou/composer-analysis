# Configuration for trial 1: Contrasting composers from different periods.
# 

experiment:
  trial: "trial1"
  description: "Contrasting composers from different periods"

dataset:
  composers: ["Johann Sebastian Bach", "Frédéric Chopin"]
  min_works_per_composer: 50

training:
  epochs: 25
  use_simple_split: true  # Use simple train/val/test split instead of k-fold