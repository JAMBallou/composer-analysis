# 
# t3b_full.yaml
# -------------------------
# Configuration for trial 3b: Full set of composers for comprehensive study.
# 

experiment:
  trial: "trial3b"
  description: "Full 14-composer subset with class imbalance"

dataset:
  composers:
    - Johann Sebastian Bach
    - Wolfgang Amadeus Mozart
    - Ludwig van Beethoven
    - Joseph Haydn
    - Frédéric Chopin
    - Franz Liszt
    - Franz Schubert
    - Johannes Brahms
    - Claude Debussy
    - Sergei Rachmaninoff
    - Alexander Scriabin
    - Felix Mendelssohn
    - Domenico Scarlatti
    - Robert Schumann
  min_works_per_composer: 20

training:
  epochs: 150  # Extended for 14-class classification task
  batch_size: 16  # Increased for better gradient estimates with many classes
  learning_rate: 0.00005  # Lower learning rate for stable convergence
  early_stopping:
    patience: 10  # Allow more epochs without improvement
    min_delta: 0.0005
  class_weighting: true
