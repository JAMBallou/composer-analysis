# 
# base.yaml
# -------------------------
# Shared base configuration for composer classification trials.
# 

experiment:
  name: "composer_classification"

dataset:
  sample_rate: 22050
  clip_duration_sec: 30
  hop_length: 512
  n_mels: 128

features:
  audio:
    mel_spectrogram: true
    mfcc:
      enabled: true
      n_mfcc: 13
      stats: ["mean", "std"]
    chroma: true
    spectral:
      centroid: true
      bandwidth: true
      rolloff: true

  midi:
    enabled: true
    note_density: true
    pitch_range: true
    mean_velocity: true
    chord_histogram: true

model:
  multimodal: true

  audio_cnn:
    embedding_dim: 512  # Increased from 256
    dropout: 0.2  # Reduced from 0.3 for better learning

  feature_mlp:
    embedding_dim: 256  # Increased from 128
    hidden_layers: [512, 256]  # Increased from [256, 128]
    dropout: 0.2  # Reduced from 0.3

  fusion:
    hidden_dim: 512  # Increased from 256
    dropout: 0.3  # Reduced from 0.4
    type: "gated" # Changed from "concat" to "gated" for better modality integration

training:
  batch_size: 8
  epochs: 40
  learning_rate: 0.00005  # Lowered from 0.0001 for more stable learning
  optimizer: "adam"
  class_weighting: true
  k_folds: 5  # Use k-fold cross validation by default. Set to null or add 'use_simple_split: true' to disable
  lr_schedule:
    enabled: true
    factor: 0.5
    patience: 3
    min_lr: 0.000001
  early_stopping:
    enabled: true
    patience: 10  # Increased from 5 to allow more learning time
    min_delta: 0.0005  # Lowered threshold for more sensitive stopping

evaluation:
  metrics: ["accuracy", "confusion_matrix", "f1_macro"]

output:
  model_dir: "outputs/models"
  log_dir: "outputs/logs"
  results_dir: "outputs/results"
