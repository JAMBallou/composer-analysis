experiment:
  trial: "trial3b"
  description: "Full 14-composer subset with class imbalance"

dataset:
  composers:
    - Johann Sebastian Bach
    - Wolfgang Amadeus Mozart
    - Ludwig van Beethoven
    - Joseph Haydn
    - Frédéric Chopin
    - Franz Liszt
    - Franz Schubert
    - Johannes Brahms
    - Claude Debussy
    - Sergei Rachmaninoff
    - Alexander Scriabin
    - Felix Mendelssohn
    - Domenico Scarlatti
    - Robert Schumann
  min_works_per_composer: 20

training:
  epochs: 60
  class_weighting: true
